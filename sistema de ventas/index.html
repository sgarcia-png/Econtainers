<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Ventas - Inicio de sesión</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body class="login-body">

    <main class="login-contenedor">

        <!-- LOGO DE LA EMPRESA -->
        <img
            src="img/logo.png"
            alt="ECONTAINERS"
            class="login-logo"
        >

        <!-- TITULO -->
        <h1 class="login-titulo">
            Sistema de Ventas
        </h1>

        <p class="login-subtitulo">
            Ingreso al sistema de gestion de ventas
        </p>

        <!-- FORMULARIO DE INICIO DE SESION -->
        <form class="login-formulario">

            <label for="usuario">
                Usuario
            </label>

            <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Ingrese su usuario"
            >

            <label for="contrasena">
                Contraseña
            </label>

            <input
                type="password"
                id="contrasena"
                name="contrasena"
                placeholder="Ingrese su contraseña"
            >

            <button
                type="submit"
                class="boton-principal"
            >
                Ingresar
            </button>

        </form>

        <p class="login-pie">
            ECONTAINERS - Sistema de Ventas
        </p>

    </main>

</body>

</html>
